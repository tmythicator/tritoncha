name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test + Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v8

      - name: Check code style (cljfmt)
        run: nix develop --command cljfmt check src test

      - name: Lint source + tests (clj-kondo)
        run: nix develop --command clj-kondo --lint src test

      - name: Run unit test suite
        run: nix develop --command pnpm test

      - name: Build production release bundle
        run: nix develop --command pnpm run build
