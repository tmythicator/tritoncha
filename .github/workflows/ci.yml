name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test + Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v8

      - name: Check code style (cargo fmt + cljfmt)
        run: nix develop --command pnpm run fmt:check

      - name: Lint source + tests (cargo clippy + clj-kondo)
        run: nix develop --command pnpm run lint

      - name: Run unit test suite (Rust DSP + ClojureScript)
        run: nix develop --command pnpm test

      - name: Build production release bundle (WASM + ClojureScript)
        run: nix develop --command pnpm run build
