[package]
name = "tritoncha-dsp"
version = "0.1.0"
edition = "2021"
authors = ["Alexandr Timchenko"]
description = "High-performance real-time WebAssembly DSP sound synthesis and physical audio engine for Tritoncha live-coding studio"
license = "AGPL-3.0-or-later"
repository = "https://github.com/tmythicator/tritoncha"
homepage = "https://github.com/tmythicator/tritoncha"
keywords = ["audio", "dsp", "synthesizer", "webaudio", "wasm"]
categories = ["multimedia::audio", "wasm"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]


[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
missing_safety_doc = "warn"
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
