# Tritoncha Rust DSP Workspace Configuration

[alias]
# Run strict Clippy linter across all targets
lint = "clippy --all-targets -- -D warnings"

# Check code formatting rules without applying changes
fmt-check = "fmt -- --check"

# Build optimized WebAssembly DSP binary artifact
wasm = "build -p tritoncha-dsp --target wasm32-unknown-unknown --release"

# Run all DSP engine unit tests
test-dsp = "test"
